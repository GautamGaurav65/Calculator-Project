<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="calculator">

        <div class="title">
            <h1>Calculator</h1>
            <p>Simple & Modern</p>
        </div>

        <form id="display">

            <!-- Display -->
            <input
                type="text"
                id="show"
                value=""
                placeholder="0"
                readonly
            >

            <!-- First Row -->
            <div class="buttons">

                <input
                    type="button"
                    class="btn special"
                    value="AC"
                    onclick="display.show.value = ''"
                >

                <input
                    type="button"
                    class="btn special"
                    value="DEL"
                    onclick="display.show.value =
                    display.show.value.toString().slice(0, -1)"
                >

                <input
                    type="button"
                    class="btn special"
                    value="%"
                    onclick="display.show.value += '%'"
                >

                <input
                    type="button"
                    class="btn operator"
                    value="/"
                    onclick="display.show.value += '/'"
                >


                <!-- Second Row -->

                <input
                    type="button"
                    class="btn"
                    value="7"
                    onclick="display.show.value += '7'"
                >

                <input
                    type="button"
                    class="btn"
                    value="8"
                    onclick="display.show.value += '8'"
                >

                <input
                    type="button"
                    class="btn"
                    value="9"
                    onclick="display.show.value += '9'"
                >

                <input
                    type="button"
                    class="btn operator"
                    value="*"
                    onclick="display.show.value += '*'"
                >


                <!-- Third Row -->

                <input
                    type="button"
                    class="btn"
                    value="4"
                    onclick="display.show.value += '4'"
                >

                <input
                    type="button"
                    class="btn"
                    value="5"
                    onclick="display.show.value += '5'"
                >

                <input
                    type="button"
                    class="btn"
                    value="6"
                    onclick="display.show.value += '6'"
                >

                <input
                    type="button"
                    class="btn operator"
                    value="-"
                    onclick="display.show.value += '-'"
                >


                <!-- Fourth Row -->

                <input
                    type="button"
                    class="btn"
                    value="1"
                    onclick="display.show.value += '1'"
                >

                <input
                    type="button"
                    class="btn"
                    value="2"
                    onclick="display.show.value += '2'"
                >

                <input
                    type="button"
                    class="btn"
                    value="3"
                    onclick="display.show.value += '3'"
                >

                <input
                    type="button"
                    class="btn operator"
                    value="+"
                    onclick="display.show.value += '+'"
                >


                <!-- Fifth Row -->

                <input
                    type="button"
                    class="btn"
                    value="00"
                    onclick="display.show.value += '00'"
                >

                <input
                    type="button"
                    class="btn"
                    value="0"
                    onclick="display.show.value += '0'"
                >

                <input
                    type="button"
                    class="btn"
                    value="."
                    onclick="display.show.value += '.'"
                >

                <input
                    type="button"
                    id="equal"
                    class="btn"
                    value="="
                    onclick="
                    try {
                        display.show.value = eval(display.show.value)
                    } catch {
                        display.show.value = 'Error'
                    }
                    "
                >

            </div>

        </form>

    </div>

</body>

</html>
